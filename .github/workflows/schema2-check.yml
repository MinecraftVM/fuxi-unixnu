name: schema2 check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: self
          persist-credentials: false

      - name: Check out UniXNU main
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: unixnu
          persist-credentials: false

      - name: Record the pinned revision
        run: git -C unixnu log --oneline -1

      - name: Prepare the device repository
        run: |
          rm -rf device
          cp -R self/device-schema2 device
          cd device
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm 'fuxi schema-2 device repository'

      - name: Pin the SM8550 SoC source
        run: |
          sha=$(git ls-remote https://github.com/UniXNU/UniXNU-sm8550-common refs/heads/main | cut -f1)
          echo "sm8550 main commit: $sha"
          test -n "$sha"
          python3 - "$sha" <<'PY'
          import pathlib, sys
          sha = sys.argv[1]
          p = pathlib.Path('device/feeds.toml')
          text = p.read_text().replace('ref = "main"', f'commit = "{sha}"')
          p.write_text(text)
          print(text)
          PY
          grep -A2 'name = "sm8550"' device/feeds.toml

      - name: Select the configuration
        run: |
          cd unixnu
          python3 ./unixnu defconfig fuxi_defconfig -D ../device

      - name: Fetch the sources
        run: |
          cd unixnu
          python3 ./unixnu fetch -D ../device

      - name: Show the resolved status
        run: |
          cd unixnu
          python3 ./unixnu status --json -D ../device > ../status.json
          head -80 ../status.json

      - name: Assemble the tree
        run: |
          cd unixnu
          python3 ./unixnu tree -D ../device
