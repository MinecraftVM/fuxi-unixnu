name: schema2 check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: self
          persist-credentials: false

      - name: Check out UniXNU main
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: unixnu
          persist-credentials: false

      - name: Record the pinned revision
        run: git -C unixnu log --oneline -1

      - name: Prepare the device repository
        run: |
          rm -rf device
          cp -R self/device-schema2 device
          cd device
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm 'fuxi schema-2 device repository'

      - name: Pin the SM8550 SoC source
        run: |
          sha=$(git ls-remote https://github.com/UniXNU/UniXNU-sm8550-common refs/heads/main | cut -f1)
          echo "sm8550 main commit: $sha"
          test -n "$sha"
          python3 - "$sha" <<'PY'
          import pathlib, sys
          sha = sys.argv[1]
          p = pathlib.Path('device/feeds.toml')
          text = p.read_text().replace('ref = "main"', f'commit = "{sha}"')
          p.write_text(text)
          print(text)
          PY
          grep -A2 'name = "sm8550"' device/feeds.toml

      - name: Select the configuration
        run: |
          cd unixnu
          python3 ./unixnu defconfig fuxi_defconfig -D ../device

      - name: Fetch the sources
        run: |
          cd unixnu
          python3 ./unixnu fetch -D ../device



      - name: Package the local workspace
        run: |
          mkdir -p local-workspace
          tar -C . -czf local-workspace/unixnu-main.tar.gz --exclude=unixnu/out --exclude=.git unixnu
          ( cd unixnu/out/feeds && tar -czf ../../../local-workspace/feeds-min.tar.gz \
              UniXNU-sm8550-common-* ArmCpu-* ArmDTPlatform-* SoftwareAES-* \
              XnuPrelink-* DarwinBoot-* ShengUfs-* VirtioMmioBlock-* VerifiedRoot-* \
              GopFramebuffer-* 2>/dev/null || true )
          ls -lh local-workspace

      - name: Upload the local workspace
        uses: actions/upload-artifact@v4
        with:
          name: local-workspace
          path: local-workspace/*.tar.gz
          retention-days: 7

      - name: Show the resolved status
        run: |
          cd unixnu
          python3 ./unixnu status --json -D ../device > ../status.json
          head -80 ../status.json


      - name: Assemble the tree
        run: |
          cd unixnu
          python3 ./unixnu tree -D ../device

      - name: Report the component catalog
        run: |
          {
            echo '--- feeds dirs'
            ls unixnu/out/feeds 2>/dev/null | head -40
            echo '--- feeds.toml'
            head -80 unixnu/feeds.toml
            echo '--- soc.toml'
            head -40 unixnu/out/feeds/UniXNU-sm8550-common-*/soc.toml
            echo '--- tree top'
            ls unixnu/out/fuxi/ipados-17.7.11-21H461/fuxi/tree 2>/dev/null | head -30
            echo '--- components.toml'
            cat unixnu/out/fuxi/ipados-17.7.11-21H461/fuxi/tree/components.toml 2>/dev/null
            echo '--- tree drivers'
            ls unixnu/out/fuxi/ipados-17.7.11-21H461/fuxi/tree/drivers 2>/dev/null
            echo '--- tree kits'
            ls unixnu/out/fuxi/ipados-17.7.11-21H461/fuxi/tree/kits 2>/dev/null
          } | tee report.txt

      - name: Show the resolved archives
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('status.json'))
          print(json.dumps(d['board']['kernel'].get('archives'), indent=1))
          PY

      - name: Build the Linux kernel toolchain
        run: |
          cd unixnu
          sudo python3 scripts/linux/setup-toolchain.py /opt/unixnu-linux

      - name: Package the toolchain
        run: |
          tar -C /opt -czf unixnu-linux.tar.gz unixnu-linux
          ls -lh unixnu-linux.tar.gz

      - name: Upload the toolchain
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-toolchain
          path: unixnu-linux.tar.gz
          retention-days: 7

      - name: Build the kernel
        run: |
          cd unixnu
          python3 ./unixnu build kernel -D ../device 2>&1 | tee -a ../report.txt | tail -100

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: schema2-report
          path: report.txt
          retention-days: 7
