name: KDK probe

on:
  workflow_dispatch:

jobs:
  sha:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Locate the AES kext and hash it
        run: |
          set -u
          echo "runner=${{ matrix.os }}"
          sw_vers || true
          echo '--- installed KDKs'
          ls -l /Library/Developer/KDKs 2>/dev/null || echo 'no /Library/Developer/KDKs'
          echo '--- search'
          for f in /Library/Developer/KDKs/*.kdk/System/Library/Extensions/IOCryptoAcceleratorFamily.kext/Contents/MacOS/IOCryptoAcceleratorFamily \
                   /System/Library/Extensions/IOCryptoAcceleratorFamily.kext/Contents/MacOS/IOCryptoAcceleratorFamily; do
            if [ -f "$f" ]; then
              echo "found $f"
              shasum -a 256 "$f"
            fi
          done
