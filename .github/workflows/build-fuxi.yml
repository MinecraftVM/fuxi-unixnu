name: fuxi build

# Builds the UniXNU boot image for the Xiaomi 13 (fuxi, SM8550) on a macOS
# runner: the kernel, UniXNU, the Mu-Silicium firmware, the payload and finally
# the boot image the stock ABL accepts.
#
# Two modes:
#   uefi  firmware only. Fast, no Apple inputs. Boot it to see the UniXNU menu.
#   full  also builds XNU from the IPSW and puts it in the payload ramdisk.
#
# The upstream pins below are the commits this workflow was written against.
# Override them in the dispatch form once you carry your own fork or fixes.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "uefi = firmware only; kernel = kernel only (assemble locally); full = everything"
        type: choice
        options: [full, kernel, uefi]
        default: full
      xcode:
        description: "Xcode version under /Applications (empty = the runner default)"
        required: false
        default: ""
      config:
        description: "console = source-only archives (a fresh build must use this); upstream needs a pre-seeded prelink closure"
        type: choice
        options: [console, upstream, full-ufs]
        default: console
      chip_id:
        description: "platform seed (16 hex digits, e.g. 0123456789abcdef); required by mode=full"
        required: false
        default: ""
      defconfig:
        description: "defconfig in the device repository (empty: follows config)"
        required: false
        default: ""
      unixnu_repo:
        description: "UniXNU build driver repository"
        default: UniXNU/UniXNU
      unixnu_ref:
        description: "UniXNU ref (commit, branch or tag)"
        default: 1a01c2afa197d975d04da892325c56b6b14aaecb
      device_repo:
        description: "device repository"
        default: hanzi123-bilp/unixnu-fuxi
      device_ref:
        description: "device repository ref"
        default: d12c0585c7c82941c17e4af6bace12dc46953c85
      uefi_repo:
        description: "Mu-Silicium checkout with the fuxi package"
        default: hanzi123-bilp/uefi-fuxi
      uefi_ref:
        description: "Mu-Silicium ref"
        default: ee589bc56d78be13108bc78e1a987cc06147722e
      fd_base:
        description: "optional override of [uefi_fd] base (leave empty: 0xA7100000 as checked in)"
        default: ""
      fd_size:
        description: "optional override of [uefi_fd] size (leave empty: 0x300000 as checked in)"
        default: ""
      extra_kernel_args:
        description: "extra XNU boot arguments, space separated (optional)"
        default: ""
      ramdisk_format:
        description: "ramdisk compression: raw = as built; lz4 or gzip carry a compressed FAT"
        type: choice
        options: [raw, lz4, gzip]
        default: raw
      candidate_macho_url:
        description: "prelink candidate (kernel.macho) URL, full-ufs only"
        required: false
        default: ""
      candidate_json_url:
        description: "prelink candidate plan (kernel.json) URL, full-ufs only"
        required: false
        default: ""
      pre_build:
        description: "optional shell commands before the kernel build (bootstrap candidates, prelink fixtures)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: fuxi-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.defconfig }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  UNIXNU_DEVICE: ${{ github.workspace }}/device
  UNIXNU_UEFI: ${{ github.workspace }}/uefi
  MODE: ${{ inputs.mode }}
  CONFIG_MODE: ${{ inputs.config }}
  DEFCONFIG_INPUT: ${{ inputs.defconfig }}
  FD_BASE: ${{ inputs.fd_base }}
  FD_SIZE: ${{ inputs.fd_size }}
  CHIP_ID: ${{ inputs.chip_id }}
  EXTRA_ARGS: ${{ inputs.extra_kernel_args }}
  RAMDISK_FORMAT: ${{ inputs.ramdisk_format }}

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: self
          persist-credentials: false

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.unixnu_repo }}
          ref: ${{ inputs.unixnu_ref }}
          path: unixnu
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repo }}
          ref: ${{ inputs.device_ref }}
          path: device
          persist-credentials: false

      - name: Check out the Mu-Silicium firmware
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.uefi_repo }}
          ref: ${{ inputs.uefi_ref }}
          path: uefi
          persist-credentials: false

      - name: Install the PMGR stub kernel patch
        run: |
          test -f self/patches/xnu/zzz-pmgr-stub.patch
          cp self/patches/xnu/zzz-pmgr-stub.patch unixnu/patches/xnu/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc mtools device-tree-compiler

      - name: Apply the fuxi build fixes
        run: |
          args=()
          if [ "$FD_BASE" != "" ] && [ "$FD_SIZE" != "" ]; then
            args+=(--fd-base "$FD_BASE" --fd-size "$FD_SIZE")
          fi
          if [ "$CONFIG_MODE" = console ]; then args+=(--console); fi
          python3 self/scripts/apply-fixes.py --uefi uefi --device device "${args[@]}" --discover --discover

      - name: Check the IPSW kernelcache pin
        run: |
          git clone -q --depth 1 https://github.com/lzfse/lzfse
          gcc -O2 -o lzfse_dec lzfse/src/*.c
          python3 self/scripts/verify-ipsw.py --unixnu unixnu --device device --lzfse ./lzfse_dec

      - name: Select the device
        run: |
          defconfig="$DEFCONFIG_INPUT"
          if [ -z "$defconfig" ]; then
            case "$CONFIG_MODE" in
              console) defconfig=fuxi_console_defconfig ;;
              full-ufs) defconfig=fuxi_full_ufs_defconfig ;;
              *) defconfig=fuxi_defconfig ;;
            esac
          fi
          python3 self/scripts/check-firmware.py --uefi uefi --device device
          python3 self/scripts/check-defconfig.py --device device --config "device/configs/$defconfig"
          cd unixnu
          ./unixnu defconfig "$defconfig"
          ./unixnu status

  build:
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: self
          persist-credentials: false

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.unixnu_repo }}
          ref: ${{ inputs.unixnu_ref }}
          path: unixnu
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repo }}
          ref: ${{ inputs.device_ref }}
          path: device
          persist-credentials: false

      - name: Check out the Mu-Silicium firmware
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.uefi_repo }}
          ref: ${{ inputs.uefi_ref }}
          path: uefi
          persist-credentials: false

      - name: Install the PMGR stub kernel patch
        run: |
          test -f self/patches/xnu/zzz-pmgr-stub.patch
          cp self/patches/xnu/zzz-pmgr-stub.patch unixnu/patches/xnu/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          # Homebrew LLVM stays off PATH on purpose: XNU must be built with
          # Xcode's clang and ld64. The driver finds the keg-only LLVM through
          # its own tool search, and self/scripts/pack-bootimg-v3.py looks in
          # /opt/homebrew/opt/{llvm,lld}/bin directly.
          brew install llvm lld mtools dtc unifdef cmake ninja lz4

      - name: Select Xcode
        run: |
          if [ -n "${{ inputs.xcode }}" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer" >> "$GITHUB_ENV"
          fi
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-runner default}"

      - name: Report the toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version | head -n 1
          "$(brew --prefix llvm)/bin/clang" --version | head -n 1
          python3 --version
          for tool in clang mformat mcopy unifdef ld.lld; do
            printf '%-12s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done
          for tool in llvm-objcopy llvm-nm; do
            printf '%-12s %s\n' "$tool" "$(brew --prefix llvm)/bin/$tool"
          done
          # The kernel step needs these; fail here instead of 40 minutes into the build.
          missing=0
          for tool in cmake ninja xcodebuild unifdef clang git make; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::$tool is missing on the runner"
              missing=1
            fi
          done
          df -h "$GITHUB_WORKSPACE"
          exit "$missing"

      - name: Apply the fuxi build fixes
        run: |
          args=()
          if [ -n "$FD_BASE" ] && [ -n "$FD_SIZE" ]; then
            args+=(--fd-base "$FD_BASE" --fd-size "$FD_SIZE")
          fi
          if [ "$CONFIG_MODE" = console ]; then
            args+=(--console)
            echo "experimental console configuration: source-only archives, no NativeAES/BootProgress/UFS"
          fi
          if [ "$CONFIG_MODE" = full-ufs ]; then
            args+=(--full-ufs)
            echo "experimental full UFS/verified-root configuration"
          fi
          if [ "$MODE" = full ]; then
            # The ABL only made room for 64 MiB of boot-image ramdisk on fuxi.
            args+=(--payload-size 64)
            echo "full mode: [payload] size_mib = 64 (the kernel is ~46 MB)"
          fi
          python3 self/scripts/apply-fixes.py --uefi uefi --device device "${args[@]}"

      - name: Select the device
        id: device
        run: |
          defconfig="$DEFCONFIG_INPUT"
          if [ -z "$defconfig" ]; then
            case "$CONFIG_MODE" in
              console) defconfig=fuxi_console_defconfig ;;
              full-ufs) defconfig=fuxi_full_ufs_defconfig ;;
              *) defconfig=fuxi_defconfig ;;
            esac
          fi
          echo "defconfig=$defconfig" >> "$GITHUB_OUTPUT"
          cd unixnu
          ./unixnu defconfig "$defconfig"
          ./unixnu status

      - name: Fetch the build sources
        run: |
          cd unixnu
          ./unixnu fetch

      - name: Fetch the IPSW components
        if: inputs.mode == 'full' || inputs.mode == 'kernel'
        run: |
          cd unixnu
          ./unixnu ipsw fetch

      - name: Run pre-build steps
        if: (inputs.mode == 'full' || inputs.mode == 'kernel') && inputs.pre_build != ''
        env:
          PRE_BUILD: ${{ inputs.pre_build }}
          DEVICE_DIR: ${{ github.workspace }}/device
        run: |
          cd unixnu
          bash -euo pipefail -c "$PRE_BUILD"

      - name: Seed the prelink closure
        if: inputs.config == 'full-ufs' && inputs.candidate_macho_url != '' && inputs.candidate_json_url != ''
        run: |
          set -eu
          pkgs=unixnu/out/fuxi/tree/build/native-prelink
          mkdir -p "$pkgs"
          curl -fL --retry 3 -o "$pkgs/native-owner-ufs-rootauth3-candidate.macho" "${{ inputs.candidate_macho_url }}"
          curl -fL --retry 3 -o "$pkgs/native-owner-ufs-rootauth3-candidate.json" "${{ inputs.candidate_json_url }}"
          ls -l "$pkgs"

      - name: Build the kernel
        if: inputs.mode == 'full' || inputs.mode == 'kernel'
        run: |
          cd unixnu
          ./unixnu build kernel

      - name: Build the UniXNU package
        if: inputs.mode != 'kernel'
        run: |
          cd unixnu
          ./unixnu build package

      - name: Build the firmware
        if: inputs.mode != 'kernel'
        run: |
          cd unixnu
          ./unixnu build firmware --uefi "$UNIXNU_UEFI"

      - name: Build the payload
        if: inputs.mode == 'full'
        run: |
          cd unixnu
          if ! [[ "$CHIP_ID" =~ ^[0-9A-Fa-f]{1,16}$ ]]; then
            echo "::error::mode=full needs chip_id: 1-16 hex digits for --unique-chip-id"
            exit 1
          fi
          args=(--uefi "$UNIXNU_UEFI" --unique-chip-id "$CHIP_ID")
          for argument in $EXTRA_ARGS; do args+=(--kernel-arg "$argument"); done
          ./unixnu build payload "${args[@]}"

      - name: Pack the boot image
        if: inputs.mode != 'kernel'
        run: |
          mkdir -p out
          fd="$UNIXNU_UEFI/Build/fuxiPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd"
          ramdisk=""
          if [ "$MODE" = full ]; then ramdisk="$GITHUB_WORKSPACE/unixnu/out/fuxi/payload/payload.img"; fi
          pack=(--uefi "$UNIXNU_UEFI" --fd "$fd" --dtb "$UNIXNU_UEFI/Resources/DTBs/fuxi.dtb"
                --ramdisk "$ramdisk" --out "$GITHUB_WORKSPACE/out/boot.img")
          if [ -n "$FD_BASE" ] && [ -n "$FD_SIZE" ]; then
            pack+=(--fd-base "$FD_BASE" --fd-size "$FD_SIZE")
          fi
          if [ "$RAMDISK_FORMAT" = gzip ]; then pack+=(--gzip-ramdisk); fi
          if [ "$RAMDISK_FORMAT" = lz4 ]; then pack+=(--lz4-ramdisk); fi
          python3 self/scripts/pack-bootimg-v3.py "${pack[@]}"
          shasum -a 256 out/boot.img
          cat out/boot.json

      - name: Collect the build logs
        if: always()
        run: |
          mkdir -p out/logs
          cp unixnu/out/fuxi/logs/*.log out/logs/ 2>/dev/null || true
          cp uefi/Build/fuxiPkg/DEBUG_CLANGPDB/Build.log out/logs/edk2-build.log 2>/dev/null || true
          (cd unixnu && ./unixnu status) > out/logs/status.txt 2>&1 || true
          ls -la out out/logs

      - name: Show the failing kernel log
        if: failure() && (inputs.mode == 'full' || inputs.mode == 'kernel')
        run: |
          echo '::group::kernel.log (tail)'
          tail -n 150 unixnu/out/fuxi/logs/kernel.log 2>/dev/null || true
          echo '::endgroup::'
          ls -la unixnu/out/fuxi/logs || true

      - name: Upload the boot image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            out/boot.img
            out/boot.json
            out/logs/
            unixnu/out/fuxi/payload/payload.json
            unixnu/out/fuxi/kernel/
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## fuxi build ($MODE)"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| defconfig | ${{ steps.device.outputs.defconfig }} |"
            echo "| device | ${{ inputs.device_repo }}@${{ inputs.device_ref }} |"
            echo "| uefi | ${{ inputs.uefi_repo }}@${{ inputs.uefi_ref }} |"
            echo "| firmware base/size | ${FD_BASE:-$(sed -n 's/^base = //p' uefi/Resources/Configs/fuxi.toml | head -1)} / ${FD_SIZE:-$(sed -n 's/^size = //p' uefi/Resources/Configs/fuxi.toml | head -1)} |"
            if [ -f out/boot.img ]; then
              echo "| boot.img | $(stat -f%z out/boot.img) bytes, sha256 $(shasum -a 256 out/boot.img | cut -d' ' -f1) |"
            else
              echo "| boot.img | not produced |"
            fi
            echo
            # shellcheck disable=SC2016  # backticks are literal text shown in the summary
            echo 'Download the artifact, then: `adb reboot bootloader` and `fastboot boot boot.img`.'
          } >> "$GITHUB_STEP_SUMMARY"