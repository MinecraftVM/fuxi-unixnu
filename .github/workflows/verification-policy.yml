name: verification policy

on:
  workflow_dispatch:

jobs:
  policy:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { path: self, persist-credentials: false }

      - name: Check out UniXNU main
        uses: actions/checkout@v4
        with: { repository: UniXNU/UniXNU, ref: main, path: unixnu, persist-credentials: false }

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - name: Prepare the device repository
        run: |
          rm -rf device
          cp -R self/device-schema2 device
          cd device && git init -q && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm init

      - name: Pin the SM8550 SoC source
        run: |
          sha=$(git ls-remote https://github.com/UniXNU/UniXNU-sm8550-common refs/heads/main | cut -f1)
          echo "sm8550 main commit: $sha"
          test -n "$sha"
          python3 - "$sha" <<'PY'
          import pathlib, sys
          sha = sys.argv[1]
          p = pathlib.Path('device/feeds.toml')
          p.write_text(p.read_text().replace('ref = "main"', f'commit = "{sha}"'))
          PY
          grep -A2 'name = "sm8550"' device/feeds.toml

      - name: Select and fetch
        run: |
          cd unixnu
          python3 ./unixnu defconfig fuxi_defconfig -D ../device
          python3 ./unixnu fetch -D ../device

      - name: Assemble the tree
        run: cd unixnu && python3 ./unixnu tree -D ../device

      - name: Extract the OS disk image from the IPSW
        run: |
          cd unixnu
          python3 ./unixnu ipsw fetch OS -D ../device || true
          ls out/ipsw/21H461 2>/dev/null || ls out/ipsw 2>/dev/null

      - name: Place the OS image
        run: |
          tree=$(ls -d unixnu/out/fuxi/*/fuxi/tree | head -1)
          mkdir -p "$tree/.cache/firmware/target-volumes"
          src=$(ls unixnu/out/ipsw/21H461/044-76040-038.dmg 2>/dev/null | head -1)
          if [ -z "$src" ]; then src=$(ls unixnu/out/ipsw/21H461/*.dmg 2>/dev/null | head -1); fi
          test -n "$src"
          cp "$src" "$tree/.cache/firmware/target-volumes/044-76040-038.dmg"
          ls -l "$tree/.cache/firmware/target-volumes"

      - name: Generate the owner key
        run: |
          tree=$(ls -d unixnu/out/fuxi/*/fuxi/tree | head -1)
          keys="$tree/build/verified-root-host/keys"
          mkdir -p "$keys"
          openssl genrsa -out "$keys/owner.pem" 3072
          openssl rsa -in "$keys/owner.pem" -pubout -out "$keys/owner-public.pem"
          ls -l "$keys"

      - name: Attach the OS image read-only
        run: |
          tree=$(ls -d unixnu/out/fuxi/*/fuxi/tree | head -1)
          vol="$tree/.cache/firmware/target-volumes/os-mount"
          mkdir -p "$vol"
          hdiutil attach -readonly -noverify -noautofsck -mountpoint "$vol" \
            "$tree/.cache/firmware/target-volumes/044-76040-038.dmg"
          hdiutil info | head -20

      - name: Patch the policy for a host without the native verifier
        run: |
          tree=$(ls -d unixnu/out/fuxi/*/fuxi/tree | head -1)
          python3 - "$tree/scripts/build-owner-os-policy.py" <<'PY'
          import sys
          p = sys.argv[1]
          t = open(p).read()
          start = t.index('native = ctypes.CDLL')
          marker = "raise SystemExit('Actual complete original OS digest differs')"
          end = t.index(marker) + len(marker)
          replacement = '''view = View()
      view.image_bytes = info['TotalSize']
      view.block_count = (view.image_bytes + 4095) // 4096
      view.generation = 1
      view.volume_uuid = expected_uuid.bytes
      complete = hashlib.sha256()
      indices = [0, 1, view.block_count // 2, view.block_count - 1]
      samples, lengths = [], []
      with disk.open('rb', buffering=1024 * 1024) as stream:
          for index in range(view.block_count):
              block = stream.read(min(4096, view.image_bytes - index * 4096))
              complete.update(block)
              if index in indices:
                  samples.append(block.ljust(4096, b'\\0'))
                  lengths.append(len(block))
          if stream.read(1):
              raise SystemExit('Virtual media exceeded its authenticated exact bounds')'''
          t = t[:start] + replacement + t[end:]
          open(p, 'w').write(t)
          print('policy patched')
          PY
      - name: Build the verification policy
        run: |
          tree=$(ls -d unixnu/out/fuxi/*/fuxi/tree | head -1)
          cd "$tree"
          python3 scripts/build-owner-os-policy.py

      - name: Upload the policy
        uses: actions/upload-artifact@v4
        with:
          name: verification-policy
          path: |
            unixnu/out/fuxi/*/fuxi/tree/build/verified-root-os/
            unixnu/out/fuxi/*/fuxi/tree/build/verified-root-host/keys/
          retention-days: 7
