schema_version = 1

[device]
name = "fuxi"
soc = "SM8550"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi 13 (fuxi), SM8550. Port migrated to the schema-2 configuration; drivers and evidence are filled area by area."

[[area]]
id = "configuration"
status = "in-progress"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", ".github/**"]
inputs = ["SM8550 SoC support, iPadOS 17.7.11 profile, fuxi board DTS converted from the vendor FDT."]
configuration = ["board.toml uses schema_version=2 with the sm8550 source and the ipados-17.7.11-21H461 profile.", "device_tree.source points at dts/fuxi.dts; the vendor FDT was 815045 bytes with model 'Qualcomm Technologies, Inc. 8550 fuxi'."]
procedure = ["Converted the vendor FDT to dts/fuxi.dts and ran ./unixnu defconfig/fetch/status/tree in CI."]
findings = ["The pinned UniXNU 1a01c2a predates schema 2; the schema-2 check workflow pins the current main instead."]
completion = ["defconfig, fetch, status --json and tree resolve with the schema-2 board.toml."]
limits = ["Component selection beyond the template set is pending; UFS/GPU/input components are not yet enabled."]
next_action = ["Resolve the schema-2 configuration in CI, then add ShengUfs and the display/input components."]
evidence = []

